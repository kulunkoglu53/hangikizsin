name: Build Barkod Okuyucu APK

on:
  push:
    branches:
      - barkod-okuyucu-apk
    paths-ignore:
      - 'apk-output/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: barkod-okuyucu-apk
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        id: build
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:assembleDebug 2>&1 | tee build.log
          CODE=${PIPESTATUS[0]}
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish build result
        shell: bash
        run: |
          mkdir -p apk-output
          if [ "${{ steps.build.outputs.exit_code }}" = "0" ] && [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk apk-output/BarkodOkuyucu.apk
            echo SUCCESS > apk-output/BUILD_STATUS.txt
          else
            echo FAILED > apk-output/BUILD_STATUS.txt
          fi
          cp build.log apk-output/build.log || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk-output
          git commit -m "BarkodOkuyucu build result v4" || exit 0
          git push origin HEAD:barkod-okuyucu-apk
      - name: Fail workflow if build failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
      - name: Upload APK artifact
        if: steps.build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: BarkodOkuyucu-APK
          path: apk-output/BarkodOkuyucu.apk
          if-no-files-found: error
          retention-days: 30
