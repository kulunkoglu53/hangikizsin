name: Build Barkod Okuyucu APK

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-barkod-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Barkod app branch
        uses: actions/checkout@v4
        with:
          ref: barkod-okuyucu-apk
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Publish APK to barkod branch
        run: |
          mkdir -p apk-output
          cp app/build/outputs/apk/debug/app-debug.apk apk-output/BarkodOkuyucu.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apk-output/BarkodOkuyucu.apk
          git commit -m "Build BarkodOkuyucu APK" || exit 0
          git push origin HEAD:barkod-okuyucu-apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BarkodOkuyucu-APK
          path: apk-output/BarkodOkuyucu.apk
          if-no-files-found: error
          retention-days: 30
