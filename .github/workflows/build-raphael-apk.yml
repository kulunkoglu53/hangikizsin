name: Build RAPHAEL Mobile APK

on:
  push:
    branches:
      - raphael-mobile-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout RAPHAEL source
        uses: actions/checkout@v4
        with:
          ref: raphael-mobile-apk
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify RAPHAEL APK
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee raphael-apk-badging.txt
          grep -q "package: name='com.raphael.assistant'" raphael-apk-badging.txt
          grep -q "versionName='0.4.0'" raphael-apk-badging.txt
          grep -q "application-label:'RAPHAEL'" raphael-apk-badging.txt
          mkdir -p apk-output-raphael
          cp "$APK" apk-output-raphael/RAPHAEL-Mobile-v0.4.apk
          sha256sum apk-output-raphael/RAPHAEL-Mobile-v0.4.apk > apk-output-raphael/RAPHAEL-Mobile-v0.4.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RAPHAEL-Mobile-v0.4
          path: |
            apk-output-raphael/RAPHAEL-Mobile-v0.4.apk
            apk-output-raphael/RAPHAEL-Mobile-v0.4.sha256
            raphael-apk-badging.txt
          if-no-files-found: error
          retention-days: 30
